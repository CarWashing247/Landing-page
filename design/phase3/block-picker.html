<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoWash247 · Payload block previews</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#0f172a;background:#f8fafc}
    *{box-sizing:border-box}
    body{margin:0;padding:clamp(20px,4vw,48px)}
    main{max-width:1160px;margin:auto}
    h1{font-size:clamp(28px,3vw,40px);letter-spacing:-.035em;margin:0 0 8px}
    p{color:#475569;line-height:1.55;max-width:65ch;margin:0 0 28px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:20px}
    figure{margin:0;background:#fff;border:1px solid #d8e1e8;border-radius:18px;overflow:hidden}
    img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover}
    figcaption{padding:16px 18px 19px;border-top:1px solid #d8e1e8}
    strong{display:block;font-size:16px;margin-bottom:4px}
    span{display:block;color:#475569;font-size:14px;line-height:1.4}
  </style>
</head>
<body>
<main>
  <h1>Page block previews</h1>
  <p>These seven illustrations appear in Payload’s Add block drawer. They show structure only. The native, localized block label remains the selectable button’s name.</p>
  <div class="grid">
    <figure><img src="../../public/block-previews/hero.svg" alt=""><figcaption><strong>Hero</strong><span>Opening heading, action, and image.</span></figcaption></figure>
    <figure><img src="../../public/block-previews/steps.svg" alt=""><figcaption><strong>Steps</strong><span>Numbered instructions in order.</span></figcaption></figure>
    <figure><img src="../../public/block-previews/pricing.svg" alt=""><figcaption><strong>Pricing</strong><span>Service cards populated from Services.</span></figcaption></figure>
    <figure><img src="../../public/block-previews/faq.svg" alt=""><figcaption><strong>FAQ</strong><span>Question and answer disclosures.</span></figcaption></figure>
    <figure><img src="../../public/block-previews/cta.svg" alt=""><figcaption><strong>Call to action</strong><span>Dark closing panel with one action.</span></figcaption></figure>
    <figure><img src="../../public/block-previews/contact.svg" alt=""><figcaption><strong>Contact</strong><span>Business details beside an inquiry form.</span></figcaption></figure>
    <figure><img src="../../public/block-previews/content.svg" alt=""><figcaption><strong>Text</strong><span>Flexible rich text and a highlighted passage.</span></figcaption></figure>
  </div>
</main>
</body>
</html>
